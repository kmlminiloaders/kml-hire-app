name: Deploy KML hire Worker

on:
  workflow_dispatch:
    inputs:
      operation:
        description: What to run
        type: choice
        required: true
        default: Deploy Worker
        options:
          - Deploy Worker
          - Install KML API key

permissions:
  contents: read

concurrency:
  group: kml-hire-cloudflare-deployment

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Set up the quotes database and deploy the Worker
        if: inputs.operation == 'Deploy Worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the GitHub repository's Actions secrets."
            exit 1
          fi
          npm run db:migrate
          npm run deploy
      - name: Install the KML API key on the live Worker
        if: inputs.operation == 'Install KML API key'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KML_ADMIN_KEY: ${{ secrets.KML_ADMIN_KEY }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$KML_ADMIN_KEY" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and KML_ADMIN_KEY in GitHub Actions secrets."
            exit 1
          fi
          node -e 'process.stdout.write(JSON.stringify({KML_ADMIN_KEY: process.env.KML_ADMIN_KEY}))' |
            npx --no-install wrangler secret bulk --name kml-hire-api
